services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thoughtplanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thoughtplanner}
      POSTGRES_DB: ${POSTGRES_DB:-thoughtplanner}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thoughtplanner}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-thoughtplanner}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-thoughtplanner-secret}
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"  # MinIO console (local only, for managing buckets)
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    env_file: .env
    environment:
      # Derived from the canonical POSTGRES_*/MINIO_* vars above rather than
      # duplicated as a literal, so rotating a password in .env actually takes
      # effect everywhere instead of silently overriding it back to defaults.
      DATABASE_URL: postgresql://${POSTGRES_USER:-thoughtplanner}:${POSTGRES_PASSWORD:-thoughtplanner}@postgres:5432/${POSTGRES_DB:-thoughtplanner}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      CI: "true"
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    env_file: .env
    environment:
      CI: "true"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "3001:3001"
      - "9000:9000"
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
